name: Testa a automação
on:
  push:
    branches: [main]
    paths: ['roles/**', 'playbooks/**', 'inventory/**', 'scripts/**', 'tests/**', 'callback_plugins/**', 'ansible.cfg', 'compose.yaml', 'Dockerfile', 'requirements*', '.github/workflows/**']
  pull_request:
    branches: [main]
    paths: ['roles/**', 'playbooks/**', 'inventory/**', 'scripts/**', 'tests/**', 'callback_plugins/**', 'ansible.cfg', 'compose.yaml', 'Dockerfile', 'requirements*', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  automation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Prepara o Ansible
        run: bash scripts/prepare.sh
      - name: Testa configuração, idempotência e drift
        run: python3 tests/verify.py
      - name: Guarda os resultados
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ansible-results
          path: |
            .local/verification.json
            .local/first-apply.json
            .local/first-apply.log
            .local/second-apply.json
            .local/second-apply.log
            .local/check-diff.json
            .local/check-diff.log
            .local/repair-drift.json
            .local/repair-drift.log
            .local/bootstrap.log
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      - name: Remove os alvos do runner
        if: always()
        run: |
          if docker compose version >/dev/null 2>&1 || [ -x .local/docker/cli-plugins/docker-compose ]; then
            bash scripts/compose.sh down --remove-orphans
          fi
