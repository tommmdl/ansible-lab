---
- name: Confere os valores antes de alterar o servidor
  ansible.builtin.assert:
    that:
      - lab_color in ['blue', 'green']
      - lab_environment in ['learning', 'staging']
      - lab_root == '/srv/ansible-lab'
    quiet: true

- name: Confere se existem listas de pacotes no alvo
  ansible.builtin.find:
    paths: /var/lib/apt/lists
    patterns: '*_Packages*'
    file_type: file
  register: apt_package_lists

- name: Instala o Nginx sem iniciar o serviço automaticamente
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: "{{ 3600 if apt_package_lists.matched > 0 else 0 }}"
    policy_rc_d: 101

- name: Cria a pasta da página
  ansible.builtin.file:
    path: "{{ lab_root }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Publica a página de cada servidor
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ lab_root }}/index.html"
    owner: root
    group: root
    mode: '0644'

- name: Configura o Nginx e valida antes de substituir o arquivo
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
    validate: '/usr/sbin/nginx -t -c %s'
  notify: Recarrega o Nginx

- name: Mantém o Nginx iniciado pelo script de serviço do pacote
  ansible.builtin.service:
    name: nginx
    state: started
    use: sysvinit
